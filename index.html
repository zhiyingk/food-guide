
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paya Lebar Food Guide</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: #f9fafb;
}

h1 {
  background: linear-gradient(135deg, #ff7f50, #ff5722);
  color: white;
  padding: 20px;
  margin: 0;
  text-align: center;
}

/* SEARCH */
.search-box {
  text-align: center;
  margin: 20px;
}

.search-box input {
  width: 60%;
  padding: 12px;
  border-radius: 25px;
  border: 1px solid #ddd;
}

/* FILTER BUTTONS */
.filters {
  text-align: center;
}

.filters button {
  margin: 5px;
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  background: #eee;
  cursor: pointer;
}

.filters button:hover {
  background: #ff7f50;
  color: white;
}

/* CARDS */
.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px; /* ✅ fixes overlap */
}

a {
  text-decoration: none;
  color: inherit;
}

.card {
  position: relative;
  overflow: hidden;
  background: white;
  border-radius: 15px;
  width: 220px;
  margin: 10px;
  padding: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

/* OVERLAY */
.overlay {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.75);
  color: white;
  text-align: center;
  padding: 8px;
  transform: translateY(100%);
  transition: 0.3s;
  font-size: 13px;
}

.card:hover .overlay {
  transform: translateY(0);
}
</style>
</head>

<body>

<h1>🍜 Paya Lebar Food Guide</h1>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search food..." onkeyup="searchFood()">
</div>

<div class="filters">
  <button onclick="filterFood('all')">All</button>
  <button onclick="filterFood('meal')">Full Meal</button>
  <button onclick="filterFood('snack')">Snack</button>
  <button onclick="filterFood('beverage')">Beverage</button>
</div>

<div class="container">

  <!-- ARNOLD'S (CLICKABLE ✅) -->
  <a href="https://www.google.com/maps/place/Arnold's+Fried+Chicken+Paya+Lebar" target="_blank">
    <div class="card meal">

      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR8_o_WUIFm1WHimBRfEmkL4wl6NWWk-Ilejg&s">

      <h3>Arnold's Fried Chicken</h3>
      <p>Crispy halal fried chicken 🍗</p>

      <div class="overlay">
        📍 City Plaza<br>
        ⭐ 4.5 | 💰 $$<br>
        Open in Google Maps
      </div>

    </div>
  </a>

  <!-- OTHER EXAMPLE -->
  <div class="card meal">
    <img src="https://via.placeholder.com/200">

    <h3>Song Fa Bak Kut Teh</h3>
    <p>Peppery soup @ PLQ</p>

    <div class="overlay">
      📍 PLQ Mall<br>
      ⭐ 4.6 | 💰 $$
    </div>
  </div>

</div>

<script>
function filterFood(category) {
  let cards = document.querySelectorAll('.card');

  cards.forEach(card => {
    let parent = card.parentElement;

    if (category === 'all') {
      parent.style.display = 'block';
    } else if (card.classList.contains(category)) {
      parent.style.display = 'block';
    } else {
      parent.style.display = 'none';
    }
  });
}

function searchFood() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    let text = card.innerText.toLowerCase();
    let parent = card.parentElement;

    if (text.includes(input)) {
      parent.style.display = "block";
    } else {
      parent.style.display = "none";
    }
  });
}
</script>

</body>
</html>
