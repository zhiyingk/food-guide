
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>🍜 Nearby Food Guide</h1>

<div class="filters">
  <button onclick="filterFood('all')">All</button>
  <button onclick="filterFood('meal')">Full Meal</button>
  <button onclick="filterFood('snack')">Snack</button>
  <button onclick="filterFood('beverage')">Beverage</button>
</div>

<div class="container">

  <div class="card meal">
    <img src="https://via.placeholder.com/200">
    <h3>Chicken Rice</h3>
    <p>Delicious local dish</p>
  </div>

  <div class="card snack">
    <img src="https://via.placeholder.com/200">
    <h3>French Fries</h3>
    <p>Crispy and golden</p>
  </div>

  <div class="card beverage">
    <img src="https://via.placeholder.com/200">
    <h3>Bubble Tea</h3>
    <p>Sweet refreshing drink</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
